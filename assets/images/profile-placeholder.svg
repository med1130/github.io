<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E3D" />
      <stop offset="100%" stop-color="#1A365D" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="200" cy="200" r="182" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.2"/>

  <!-- Electrical Circuit Accent Rays -->
  <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.35">
    <line x1="200" y1="20" x2="200" y2="45" />
    <circle cx="200" cy="20" r="4" fill="url(#goldGrad)"/>
    <line x1="200" y1="380" x2="200" y2="355" />
    <circle cx="200" cy="380" r="4" fill="url(#goldGrad)"/>
    <line x1="20" y1="200" x2="45" y2="200" />
    <circle cx="20" cy="200" r="4" fill="url(#goldGrad)"/>
    <line x1="380" y1="200" x2="355" y2="200" />
    <circle cx="380" cy="200" r="4" fill="url(#goldGrad)"/>
  </g>

  <!-- Professional Avatar Silhouette -->
  <g filter="url(#shadow)">
    <!-- Head -->
    <circle cx="200" cy="150" r="60" fill="#E2E8F0"/>
    <!-- Suit Shoulders & Tie -->
    <path d="M90 320 C90 230 140 220 200 220 C260 220 310 230 310 320 C310 335 300 350 200 350 C100 350 90 335 90 320 Z" fill="#E2E8F0"/>
    <!-- Collar & Gold Tie Accent -->
    <polygon points="175,220 200,280 225,220 200,230" fill="url(#goldGrad)"/>
    <polygon points="185,220 200,235 215,220" fill="#0B1E3D"/>
  </g>

  <!-- Initial Badge -->
  <rect x="150" y="315" width="100" height="30" rx="15" fill="url(#goldGrad)"/>
  <text x="200" y="335" font-family="'Tajawal', 'Inter', sans-serif" font-size="14" font-weight="bold" fill="#0B1E3D" text-anchor="middle">M. BELKADI</text>
</svg>
